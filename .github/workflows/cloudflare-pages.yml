name: CI / Security / Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile --non-interactive

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL || 'https://api.example.invalid' }}
        run: yarn test --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL || 'https://api.example.invalid' }}
        run: yarn build

      - name: Upload Pages build
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Pages build
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-build
          path: frontend/build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/build --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

  dast:
    name: DAST (OWASP ZAP Baseline)
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Scan deployed Cloudflare Pages site
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev
          fail_action: false

      - name: Scan API (optional)
        if: ${{ vars.DAST_API_URL != '' }}
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.DAST_API_URL }}
          fail_action: false
