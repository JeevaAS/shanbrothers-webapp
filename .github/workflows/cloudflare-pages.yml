name: CI / Security / Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile --non-interactive

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL || 'https://api.example.invalid' }}
        run: yarn test --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL || 'https://api.example.invalid' }}
        run: yarn build

      - name: Upload Pages build
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 1

  pages-project:
    name: Find or create Cloudflare Pages project
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.project.outputs.name }}
    steps:
      - name: Resolve project name and create it if missing
        id: project
        env:
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository variable"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }

          if [ -n "$CONFIGURED_PROJECT_NAME" ]; then
            PROJECT_NAME="$CONFIGURED_PROJECT_NAME"
          else
            PROJECT_NAME=$(printf '%s' "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//')
          fi
          if ! printf '%s' "$PROJECT_NAME" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "Invalid Cloudflare Pages project name '$PROJECT_NAME'. Use lowercase letters, digits, and hyphens."
            exit 1
          fi

          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"
          STATUS=$(curl --silent --show-error --output project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CF_API_TOKEN}" \
            "${API_BASE}/${PROJECT_NAME}")
          if [ "$STATUS" = "404" ]; then
            jq -n --arg name "$PROJECT_NAME" '{name: $name, production_branch: "main"}' > project-request.json
            STATUS=$(curl --silent --show-error --output project.json --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${CF_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data @project-request.json \
              "$API_BASE")
          fi
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ] || ! jq -e '.success == true' project.json >/dev/null; then
            echo "Cloudflare Pages project lookup/creation failed (HTTP $STATUS)."
            if [ "$STATUS" = "401" ]; then
              echo "The CLOUDFLARE_API_TOKEN secret is invalid or expired. Store the API token value (not its dashboard name) in GitHub Actions secrets."
            elif [ "$STATUS" = "403" ]; then
              echo "The token was recognized but lacks access: grant Account > Cloudflare Pages > Edit (Pages Write) and include the account identified by CLOUDFLARE_ACCOUNT_ID in the token's account resources."
            else
              echo "Check that CLOUDFLARE_ACCOUNT_ID identifies the intended account and that the token has Cloudflare Pages Write permission."
            fi
            jq -r '.errors[]?.message' project.json || true
            exit 1
          fi
          echo "Using Cloudflare Pages project: $PROJECT_NAME"
          echo "name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    needs: [build, pages-project]
    runs-on: ubuntu-latest
    steps:
      - name: Download Pages build
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-build
          path: frontend/build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/build --project-name=${{ needs.pages-project.outputs.name }} --branch=main

  dast:
    name: DAST (OWASP ZAP Baseline)
    if: github.ref == 'refs/heads/main'
    needs: [deploy, pages-project]
    runs-on: ubuntu-latest
    steps:
      - name: Scan deployed Cloudflare Pages site
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://${{ needs.pages-project.outputs.name }}.pages.dev
          fail_action: false

      - name: Scan API (optional)
        if: ${{ vars.DAST_API_URL != '' }}
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.DAST_API_URL }}
          fail_action: false
